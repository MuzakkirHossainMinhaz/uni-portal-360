name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Format, lint, compile and unit tests
        run: npm run check
      - name: Start local MongoDB replica set
        run: |
          docker run -d --name uni-portal-mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec uni-portal-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec uni-portal-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec uni-portal-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: API integration smoke
        working-directory: backend
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
          JWT_ACCESS_SECRET: ci-access-secret-is-unique-and-over-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-is-unique-and-over-32-characters
          NODE_ENV: test
        run: npm run test:smoke
